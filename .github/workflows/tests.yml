# Relay tests on every push and pull request: the logic, then real relays over real sockets, no game needed. The Steam
# link needs a running game, so it isn't covered here.
# Read-only token, actions pinned by commit. (CI idea from appdoze's PR #2.)
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  relay:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - run: .\tools\netlab\all.ps1
        shell: pwsh
